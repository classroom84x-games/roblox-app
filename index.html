<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Roblox launcher</title>

    <link rel="icon" href="roblox.png" sizes="32x32">
    <link rel="icon" href="roblox.png" sizes="192x192">
    <link rel="apple-touch-icon" href="roblox.png">
    
    <link rel="manifest" href="manifest.json">

    <script>
        window.onload = function () {
            if (navigator.userAgent.includes("roblox")) {
                window.location.href = "roblox://";
            }
        }
    </script>
</head>
<body>
    <h1>Roblox Luancher by Classroom84x for Android</h1>
    <p>Click "Add to Home Screen" to create a shortcut.</p>
</body>
</html>
